<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Outbreak</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0d0d0d;
            color:white;
            text-align:center;
        }

        header{
            padding:80px 20px;
            background:linear-gradient(#111,#181818);
        }

        h1{
            font-size:60px;
            color:#e53935;
        }

        p{
            margin-top:15px;
            font-size:20px;
            color:#cfcfcf;
        }

        .button{
            display:inline-block;
            margin-top:35px;
            padding:15px 35px;
            background:#e53935;
            color:white;
            text-decoration:none;
            border-radius:8px;
            transition:.25s;
        }

        .button:hover{
            background:#ff4d4d;
        }

        section{
            padding:80px 20px;
        }

        footer{
            padding:30px;
            background:#111;
            color:#777;
        }
    </style>
</head>

<body>

<header>

<h1>Zombie Outbreak</h1>

<p>Survive. Fight. Escape.</p>

<a class="button" href="#">Join the Discord</a>

</header>

<section>

<h2>Welcome</h2>

<p>
Welcome to Zombie Outbreak! Battle endless hordes of zombies,
team up with friends, unlock powerful weapons, and survive
the apocalypse.
</p>

</section>

<footer>

© 2026 Zombie Outbreak

</footer>

</body>
</html>
